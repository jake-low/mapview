[package]
name = "mapview"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
include_dir = "0.7.4"
open = "5.3.6"
r2d2 = "0.8.10"
r2d2_sqlite = "0.33"
rocket = { version = "0.5.1", features = ["json"] }
rocket_seek_stream = "0.2.6"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
urlencoding = "2.1.3"
